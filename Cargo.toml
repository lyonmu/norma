[package]
name = "norma"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.102"
config = "0.15.23"
flate2 = "1.1.9"
gpui = "0.2.2"
ignore = "0.4.26"
notify = "9.0.0-rc.4"
serde = { version = "1.0.228", features = ["derive"] }
toml = "1.1.2"
thiserror = "2.0.18"
tracing = "0.1.44"
tracing-appender = "0.2.5"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt", "json"] }
rig-core = "0.38.2"
tokio = { version = "1.48.0", features = ["rt"] }

[dev-dependencies]
tempfile = "3.27.0"

[package.metadata.bundle]
name = "norma"
identifier = "com.lyonmu.norma"
version = "0.1.0"
icon = ["icons/icon.icns"]
category = "Agent"
short_description = "cross-platform Agent"
long_description = """
Norma is a cross-platform desktop agent built with GPUI, 
featuring multi-model support, MCP integration, Skills, ACP communication, and collaborative multi-agent workflows.
"""

[package.metadata.deb]
maintainer = "lyonmu <lyonmu@foxmail.com>"
copyright = "2026, lyonmu <lyonmu@foxmail.com>"
license-file = ["LICENSE", "4"]
extended-description = """\
Norma is a cross-platform desktop agent built with GPUI, 
featuring multi-model support, MCP integration, Skills, ACP communication, and collaborative multi-agent workflows.
"""
depends = "$auto"
section = "devel"
priority = "optional"
assets = [
    ["target/release/norma", "usr/bin/", "755"],
    ["README.md", "usr/share/doc/norma/README", "644"],
]
